<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Greetings in nine languages">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1024" />
      <stop offset="60%" stop-color="#0d1428" />
      <stop offset="100%" stop-color="#121a34" />
    </linearGradient>
    <linearGradient id="g-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="g-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05" />
    </pattern>
  </defs>
  <rect width="1200" height="150" fill="url(#g-bg)" />
  <rect width="1200" height="150" fill="url(#g-scan)" />
  <!-- greeting, cross fading through nine languages over one 21.6s cycle -->
  <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#e8edf3" font-size="44">
    <text x="600" y="74" opacity="1">こんにちは</text>
    <text x="600" y="74" opacity="0">안녕하세요</text>
    <text x="600" y="74" opacity="0">你好</text>
    <text x="600" y="74" opacity="0">食飽未</text>
    <text x="600" y="74" opacity="0">שלום</text>
    <text x="600" y="74" opacity="0">Hallo</text>
    <text x="600" y="74" opacity="0">Bonjour</text>
    <text x="600" y="74" opacity="0">G'day</text>
    <text x="600" y="74" opacity="0">नमस्ते</text>
  </g>
  <g text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" fill="#64748b" font-size="11" letter-spacing="3">
    <text x="600" y="106" opacity="1">日本 · JAPAN</text>
    <text x="600" y="106" opacity="0">한국 · KOREA</text>
    <text x="600" y="106" opacity="0">中国 · CHINA</text>
    <text x="600" y="106" opacity="0">臺灣 · TAIWAN, IN HOKKIEN</text>
    <text x="600" y="106" opacity="0">ISRAEL</text>
    <text x="600" y="106" opacity="0">DEUTSCHLAND · GERMANY</text>
    <text x="600" y="106" opacity="0">CANADA</text>
    <text x="600" y="106" opacity="0">AUSTRALIA</text>
    <text x="600" y="106" opacity="0">भारत · INDIA</text>
  </g>
  <!-- nine step markers -->
  <g fill="#2b3648">
    <circle cx="512" cy="130" r="3" />
    <circle cx="534" cy="130" r="3" />
    <circle cx="556" cy="130" r="3" />
    <circle cx="578" cy="130" r="3" />
    <circle cx="600" cy="130" r="3" />
    <circle cx="622" cy="130" r="3" />
    <circle cx="644" cy="130" r="3" />
    <circle cx="666" cy="130" r="3" />
    <circle cx="688" cy="130" r="3" />
  </g>
  <g fill="#22d3ee">
    <circle cx="512" cy="130" r="3.4" opacity="1"></circle>
    <circle cx="534" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="556" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="578" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="600" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="622" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="644" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="666" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="688" cy="130" r="3.4" opacity="0"></circle>
  </g>
  <!-- cycle progress hairline -->
  <rect x="0" y="147" width="0" height="1.6" fill="url(#g-sweep)"></rect>
</svg>