<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="title desc">
  <title id="title">Count the missing: a SQLite example</title>
  <desc id="desc">Four synthetic backend results. Simulator D has two scored values across three runs. This is not a live benchmark.</desc>
  <metadata id="query-data">[["simulator_a", 0.982, 3, 3], ["simulator_b", 0.964, 3, 3], ["simulator_c", 0.941, 3, 3], ["simulator_d", 0.902, 2, 3]]</metadata>
  <style>text{font-family:Consolas,Menlo,monospace}.line-0{animation:line0 18s linear infinite}@keyframes line0{0%,2%{opacity:0}3%,100%{opacity:1}}.line-1{animation:line1 18s linear infinite}@keyframes line1{0%,5%{opacity:0}6%,100%{opacity:1}}.line-2{animation:line2 18s linear infinite}@keyframes line2{0%,8%{opacity:0}9%,100%{opacity:1}}.line-3{animation:line3 18s linear infinite}@keyframes line3{0%,11%{opacity:0}12%,100%{opacity:1}}.line-4{animation:line4 18s linear infinite}@keyframes line4{0%,14%{opacity:0}15%,100%{opacity:1}}.line-5{animation:line5 18s linear infinite}@keyframes line5{0%,17%{opacity:0}18%,100%{opacity:1}}.line-6{animation:line6 18s linear infinite}@keyframes line6{0%,20%{opacity:0}21%,100%{opacity:1}}.line-7{animation:line7 18s linear infinite}@keyframes line7{0%,23%{opacity:0}24%,100%{opacity:1}}.line-8{animation:line8 18s linear infinite}@keyframes line8{0%,26%{opacity:0}27%,100%{opacity:1}}.line-9{animation:line9 18s linear infinite}@keyframes line9{0%,29%{opacity:0}30%,100%{opacity:1}}.results{animation:result 18s linear infinite}@keyframes result{0%,36%{opacity:0}42%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect width="480" height="760" rx="12" fill="#081120" />
  <rect x="1" y="1" width="478" height="758" rx="12" fill="none" stroke="#284158" />
  <path d="M0 56H480" stroke="#284158" />
  <circle cx="26" cy="28" r="4" fill="#ffbaad" />
  <circle cx="42" cy="28" r="4" fill="#ffd284" />
  <circle cx="58" cy="28" r="4" fill="#75e1ec" />
  <text x="78" y="34" font-size="15" fill="#e5edf7">experiments.db / SQLite</text>
  <text x="24" y="91" font-size="16" fill="#75e1ec" letter-spacing="2">COUNT THE MISSING.</text>
  <text x="456" y="91" font-size="13" fill="#ffd284" text-anchor="end">DEMO</text>
  <g class="code line-0">
    <text x="24" y="137" font-size="17" fill="#75e1ec" id="query-line-0" xml:space="preserve">SELECT backend,</text>
  </g>
  <g class="code line-1">
    <text x="24" y="165" font-size="17" fill="#e5edf7" id="query-line-1" xml:space="preserve">       ROUND(AVG(fidelity), 3)</text>
  </g>
  <g class="code line-2">
    <text x="24" y="193" font-size="17" fill="#e5edf7" id="query-line-2" xml:space="preserve">         AS mean_fidelity,</text>
  </g>
  <g class="code line-3">
    <text x="24" y="221" font-size="17" fill="#e5edf7" id="query-line-3" xml:space="preserve">       COUNT(fidelity) AS scored,</text>
  </g>
  <g class="code line-4">
    <text x="24" y="249" font-size="17" fill="#e5edf7" id="query-line-4" xml:space="preserve">       COUNT(*) AS runs</text>
  </g>
  <g class="code line-5">
    <text x="24" y="277" font-size="17" fill="#75e1ec" id="query-line-5" xml:space="preserve">FROM experiment_runs</text>
  </g>
  <g class="code line-6">
    <text x="24" y="305" font-size="17" fill="#75e1ec" id="query-line-6" xml:space="preserve">WHERE circuit = 'ghz_8q'</text>
  </g>
  <g class="code line-7">
    <text x="24" y="333" font-size="17" fill="#75e1ec" id="query-line-7" xml:space="preserve">GROUP BY backend</text>
  </g>
  <g class="code line-8">
    <text x="24" y="361" font-size="17" fill="#75e1ec" id="query-line-8" xml:space="preserve">ORDER BY mean_fidelity DESC,</text>
  </g>
  <g class="code line-9">
    <text x="24" y="389" font-size="17" fill="#e5edf7" id="query-line-9" xml:space="preserve">         backend ASC;</text>
  </g>
  <path d="M24 417H456" stroke="#284158" />
  <text x="24" y="461" font-size="14" fill="#9eb0c8">backend</text>
  <text x="222" y="461" font-size="14" fill="#9eb0c8">mean</text>
  <text x="330" y="461" font-size="14" fill="#9eb0c8">scored</text>
  <text x="418" y="461" font-size="14" fill="#9eb0c8">runs</text>
  <g class="results">
    <rect x="16" y="479" width="448" height="40" rx="4" fill="#102137" />
    <text x="24" y="504" font-size="16" fill="#e5edf7" id="row-0-col-0">simulator_a</text>
    <text x="222" y="504" font-size="16" fill="#75e1ec" id="row-0-col-1">0.982</text>
    <text x="330" y="504" font-size="16" fill="#e5edf7" id="row-0-col-2">3</text>
    <text x="418" y="504" font-size="16" fill="#e5edf7" id="row-0-col-3">3</text>
    <rect x="16" y="522" width="448" height="40" rx="4" fill="#0b192c" />
    <text x="24" y="547" font-size="16" fill="#e5edf7" id="row-1-col-0">simulator_b</text>
    <text x="222" y="547" font-size="16" fill="#75e1ec" id="row-1-col-1">0.964</text>
    <text x="330" y="547" font-size="16" fill="#e5edf7" id="row-1-col-2">3</text>
    <text x="418" y="547" font-size="16" fill="#e5edf7" id="row-1-col-3">3</text>
    <rect x="16" y="565" width="448" height="40" rx="4" fill="#102137" />
    <text x="24" y="590" font-size="16" fill="#e5edf7" id="row-2-col-0">simulator_c</text>
    <text x="222" y="590" font-size="16" fill="#75e1ec" id="row-2-col-1">0.941</text>
    <text x="330" y="590" font-size="16" fill="#e5edf7" id="row-2-col-2">3</text>
    <text x="418" y="590" font-size="16" fill="#e5edf7" id="row-2-col-3">3</text>
    <rect x="16" y="608" width="448" height="40" rx="4" fill="#0b192c" />
    <text x="24" y="633" font-size="16" fill="#e5edf7" id="row-3-col-0">simulator_d</text>
    <text x="222" y="633" font-size="16" fill="#75e1ec" id="row-3-col-1">0.902</text>
    <text x="330" y="633" font-size="16" fill="#ffd284" id="row-3-col-2">2</text>
    <text x="418" y="633" font-size="16" fill="#e5edf7" id="row-3-col-3">3</text>
  </g>
  <path d="M0 694H480" stroke="#284158" />
  <text x="24" y="721" font-size="14" fill="#9eb0c8">14 synthetic rows · 4 grouped results</text>
  <text x="24" y="743" font-size="13" fill="#9eb0c8">NULL excluded by AVG · included by COUNT(*)</text>
</svg>