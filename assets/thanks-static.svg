<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Thanks for viewing, in nine languages: Japanese, Korean, Chinese, Taiwanese Hokkien, Hebrew, German, French, English and Hindi">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121a34" />
      <stop offset="40%" stop-color="#0d1428" />
      <stop offset="100%" stop-color="#0a1024" />
    </linearGradient>
    <linearGradient id="t-sweep" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0" />
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="t-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05" />
    </pattern>
  </defs>
  <rect width="1200" height="150" fill="url(#t-bg)" />
  <rect width="1200" height="150" fill="url(#t-scan)" />
  <!-- thanks, cross fading through nine languages over one 21.6s cycle -->
  <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#e8edf3" font-size="42">
    <text x="600" y="74" opacity="1">ありがとうございます</text>
    <text x="600" y="74" opacity="0">봐주셔서 감사합니다</text>
    <text x="600" y="74" opacity="0">感谢观看</text>
    <text x="600" y="74" opacity="0">多謝</text>
    <text x="600" y="74" opacity="0">תודה רבה</text>
    <text x="600" y="74" opacity="0">Danke fürs Vorbeischauen</text>
    <text x="600" y="74" opacity="0">Merci de votre visite</text>
    <text x="600" y="74" opacity="0">Cheers for stopping by</text>
    <text x="600" y="74" opacity="0">देखने के लिए धन्यवाद</text>
  </g>
  <g text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" fill="#64748b" font-size="11" letter-spacing="3">
    <text x="600" y="106" opacity="1">日本 · JAPAN</text>
    <text x="600" y="106" opacity="0">한국 · KOREA</text>
    <text x="600" y="106" opacity="0">中国 · CHINA</text>
    <text x="600" y="106" opacity="0">臺灣 · TAIWAN, IN HOKKIEN</text>
    <text x="600" y="106" opacity="0">ISRAEL</text>
    <text x="600" y="106" opacity="0">DEUTSCHLAND · GERMANY</text>
    <text x="600" y="106" opacity="0">FRANCE · CANADA</text>
    <text x="600" y="106" opacity="0">AUSTRALIA</text>
    <text x="600" y="106" opacity="0">भारत · INDIA</text>
  </g>
  <g fill="#2b3648">
    <circle cx="512" cy="130" r="3" />
    <circle cx="534" cy="130" r="3" />
    <circle cx="556" cy="130" r="3" />
    <circle cx="578" cy="130" r="3" />
    <circle cx="600" cy="130" r="3" />
    <circle cx="622" cy="130" r="3" />
    <circle cx="644" cy="130" r="3" />
    <circle cx="666" cy="130" r="3" />
    <circle cx="688" cy="130" r="3" />
  </g>
  <g fill="#a78bfa">
    <circle cx="512" cy="130" r="3.4" opacity="1"></circle>
    <circle cx="534" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="556" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="578" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="600" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="622" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="644" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="666" cy="130" r="3.4" opacity="0"></circle>
    <circle cx="688" cy="130" r="3.4" opacity="0"></circle>
  </g>
  <!-- the closing sweep runs right to left, mirroring the opening panel -->
  <rect x="1200" y="1" width="0" height="1.6" fill="url(#t-sweep)"></rect>
</svg>