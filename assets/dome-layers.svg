<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Three shield layers with patrolling monitor drones. Three incoming threats are intercepted: an unsourced claim stopped at the evidence layer, a silent regression stopped at the evaluation layer, and production drift stopped at the observability layer.">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b1c"/><stop offset="60%" stop-color="#0a1330"/><stop offset="100%" stop-color="#101c40"/>
    </linearGradient>
    <pattern id="dl-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05"/>
    </pattern>
    <radialGradient id="dl-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#4fd6c8" stop-opacity="0.16"/><stop offset="100%" stop-color="#4fd6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dl-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fd6c8" stop-opacity="0.28"/><stop offset="100%" stop-color="#4fd6c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="dl-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1200" height="380" fill="url(#dl-bg)"/>
  <circle cx="330" cy="430" r="380" fill="url(#dl-glow)"/>
  <rect width="1200" height="380" fill="url(#dl-scan)"/>

  <g stroke="#4fd6c8" stroke-width="1.6" fill="none" opacity="0.42">
    <path d="M16,44 V16 H44"/><path d="M1156,16 H1184 V44"/>
    <path d="M1184,336 V364 H1156"/><path d="M44,364 H16 V336"/>
    <animate attributeName="opacity" values="0.42;0.78;0.42" dur="4.4s" repeatCount="indefinite"/>
  </g>

  <text x="56" y="40" fill="#4fd6c8" opacity="0.9" font-size="11" letter-spacing="3.2"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">DEFENCE IN DEPTH · FOR AI SYSTEMS</text>
  <text x="30" y="110" fill="#4fd6c8" opacity="0.13" font-size="13"
        font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
    <tspan x="30" dy="0">シ</tspan><tspan x="30" dy="18">ー</tspan><tspan x="30" dy="18">ル</tspan><tspan x="30" dy="18">ド</tspan>
  </text>

  <!-- the three shields -->
  <g fill="none" stroke-linecap="round">
    <path id="dl-outer" d="M40.2,352.3 A300,300 0 0 1 619.8,352.3" stroke="#4fd6c8" stroke-width="2.6" opacity="0.85"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.2s" begin="0.1s" fill="freeze"/>
    </path>
    <path id="dl-mid" d="M102.9,369.2 A235,235 0 0 1 557.1,369.2" stroke="#4a86f7" stroke-width="2.6" opacity="0.85"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.2s" begin="0.45s" fill="freeze"/>
    </path>
    <path id="dl-inner" d="M165.7,386 A170,170 0 0 1 494.3,386" stroke="#ff7a5c" stroke-width="2.6" opacity="0.85"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.2s" begin="0.8s" fill="freeze"/>
    </path>
  </g>

  <!-- a charge circulating in each shield -->
  <g fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M40.2,352.3 A300,300 0 0 1 619.8,352.3" stroke="#c9fff8" stroke-width="2.6" pathLength="100" stroke-dasharray="6 94">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5.5s" begin="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M102.9,369.2 A235,235 0 0 1 557.1,369.2" stroke="#cfe0ff" stroke-width="2.6" pathLength="100" stroke-dasharray="6 94">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5.5s" begin="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M165.7,386 A170,170 0 0 1 494.3,386" stroke="#ffd2c6" stroke-width="2.6" pathLength="100" stroke-dasharray="6 94">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5.5s" begin="2.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- three incoming threats, each stopped by a different layer -->
  <!-- A: an unsourced claim, stopped at the outer shield -->
  <g opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.178;0.300;1" path="M20,-40 L100.2,237.2"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.178;0.192;0.296;0.302;1" dur="9s" repeatCount="indefinite"/>
    <line x1="-9" y1="-31" x2="0" y2="0" stroke="#ff5c7a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
    <circle r="3.4" fill="#ffe0e6"/>
    <circle r="7" fill="#ff5c7a" opacity="0.5" filter="url(#dl-soft)"/>
  </g>
  <!-- B: a silent regression, gets past the outer shield, stopped at evaluation -->
  <g opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.378;0.500;1" path="M190,-40 L269.1,203"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.378;0.392;0.496;0.502;1" dur="9s" repeatCount="indefinite"/>
    <line x1="-8" y1="-31" x2="0" y2="0" stroke="#ff5c7a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
    <circle r="3.4" fill="#ffe0e6"/>
    <circle r="7" fill="#ff5c7a" opacity="0.5" filter="url(#dl-soft)"/>
  </g>
  <!-- C: production drift, gets past both, stopped at observability -->
  <g opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.578;0.700;1" path="M500,-40 L401.8,275.9"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.578;0.592;0.696;0.702;1" dur="9s" repeatCount="indefinite"/>
    <line x1="10" y1="-30" x2="0" y2="0" stroke="#ff5c7a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
    <circle r="3.4" fill="#ffe0e6"/>
    <circle r="7" fill="#ff5c7a" opacity="0.5" filter="url(#dl-soft)"/>
  </g>

  <!-- the interceptions -->
  <g fill="none" stroke-width="2.2">
    <circle cx="100.2" cy="237.2" r="0" stroke="#4fd6c8">
      <animate attributeName="r" values="0;0;30;30" keyTimes="0;0.300;0.360;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.300;0.306;0.360;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="269.1" cy="203" r="0" stroke="#4a86f7">
      <animate attributeName="r" values="0;0;30;30" keyTimes="0;0.500;0.560;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.500;0.506;0.560;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="401.8" cy="275.9" r="0" stroke="#ff7a5c">
      <animate attributeName="r" values="0;0;30;30" keyTimes="0;0.700;0.760;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.700;0.706;0.760;1" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g filter="url(#dl-soft)">
    <circle cx="100.2" cy="237.2" r="13" fill="#c9fff8" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.300;0.308;0.350;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="269.1" cy="203" r="13" fill="#cfe0ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.500;0.508;0.550;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="401.8" cy="275.9" r="13" fill="#ffd2c6" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.700;0.708;0.750;1" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- monitor drones on patrol, one per shield -->
  <g>
    <animateMotion dur="17s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1" keyTimes="0;1">
      <mpath href="#dl-outer"/>
    </animateMotion>
    <polygon points="0,7 -9,22 9,22" fill="url(#dl-cone)"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#cfe8ff" stroke-width="1.4"/>
    <ellipse cx="0" cy="1.6" rx="3.4" ry="2.1" fill="#cfe8ff"/>
    <ellipse cx="-7" cy="-1.6" rx="4" ry="1.2" fill="none" stroke="#cfe8ff" stroke-width="1">
      <animate attributeName="rx" values="4;1.5;4" dur="0.2s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="7" cy="-1.6" rx="4" ry="1.2" fill="none" stroke="#cfe8ff" stroke-width="1">
      <animate attributeName="rx" values="4;1.5;4" dur="0.2s" begin="0.1s" repeatCount="indefinite"/></ellipse>
    <circle cx="0" cy="5" r="1.3" fill="#4fd6c8"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <animateMotion dur="13s" repeatCount="indefinite" calcMode="linear" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#dl-mid"/>
    </animateMotion>
    <polygon points="0,7 -8,20 8,20" fill="url(#dl-cone)"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#cfe8ff" stroke-width="1.3"/>
    <ellipse cx="0" cy="1.4" rx="3" ry="1.9" fill="#cfe8ff"/>
    <ellipse cx="-6" cy="-1.4" rx="3.5" ry="1.1" fill="none" stroke="#cfe8ff" stroke-width="1">
      <animate attributeName="rx" values="3.5;1.3;3.5" dur="0.2s" begin="0.05s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="6" cy="-1.4" rx="3.5" ry="1.1" fill="none" stroke="#cfe8ff" stroke-width="1">
      <animate attributeName="rx" values="3.5;1.3;3.5" dur="0.2s" begin="0.15s" repeatCount="indefinite"/></ellipse>
    <circle cx="0" cy="4.6" r="1.2" fill="#4a86f7"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1" keyTimes="0;1">
      <mpath href="#dl-inner"/>
    </animateMotion>
    <polygon points="0,6 -7,18 7,18" fill="url(#dl-cone)"/>
    <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#cfe8ff" stroke-width="1.2"/>
    <ellipse cx="0" cy="1.3" rx="2.7" ry="1.7" fill="#cfe8ff"/>
    <ellipse cx="-5.5" cy="-1.3" rx="3.2" ry="1" fill="none" stroke="#cfe8ff" stroke-width="0.9">
      <animate attributeName="rx" values="3.2;1.2;3.2" dur="0.2s" begin="0.02s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="5.5" cy="-1.3" rx="3.2" ry="1" fill="none" stroke="#cfe8ff" stroke-width="0.9">
      <animate attributeName="rx" values="3.2;1.2;3.2" dur="0.2s" begin="0.12s" repeatCount="indefinite"/></ellipse>
    <circle cx="0" cy="4.2" r="1.1" fill="#ff7a5c"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- what each layer is for -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <circle cx="668" cy="83" r="6" fill="#4fd6c8"><animate attributeName="r" values="5;7.5;5" dur="9s" keyTimes="0;0.305;1" repeatCount="indefinite"/></circle>
    <text x="688" y="88" fill="#4fd6c8" font-size="14" letter-spacing="2.6" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">EVIDENCE</text>
    <text x="688" y="109" fill="#94a3b8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Nothing enters a system of mine without a source I can point at.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.85s" fill="freeze"/>
    <circle cx="668" cy="145" r="6" fill="#4a86f7"><animate attributeName="r" values="5;7.5;5" dur="9s" keyTimes="0;0.505;1" repeatCount="indefinite"/></circle>
    <text x="688" y="150" fill="#7aa5f9" font-size="14" letter-spacing="2.6" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">EVALUATION</text>
    <text x="688" y="171" fill="#94a3b8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">What comes out is measured against a baseline, not a feeling.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
    <circle cx="668" cy="207" r="6" fill="#ff7a5c"><animate attributeName="r" values="5;7.5;5" dur="9s" keyTimes="0;0.705;1" repeatCount="indefinite"/></circle>
    <text x="688" y="212" fill="#ff9d85" font-size="14" letter-spacing="2.6" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">OBSERVABILITY</text>
    <text x="688" y="233" fill="#94a3b8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">When it drifts in production, the logs say so before a user does.</text>
  </g>

  <!-- intercept log -->
  <line x1="668" y1="258" x2="1150" y2="258" stroke="#1c3247" stroke-width="1.2"/>
  <circle cx="674" cy="278" r="3.4" fill="#4fd6c8"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="688" y="282" fill="#475569" font-size="10.5" letter-spacing="2"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">INTERCEPT LOG · 3 SHIELDS UP · 3 MONITORS PATROLLING</text>

  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.7s" fill="freeze"/>
      <rect x="670" y="302" width="8" height="8" fill="#4fd6c8"/>
      <text x="690" y="310" fill="#c9d5e4">unsourced claim</text>
      <text x="900" y="310" fill="#4fd6c8">STOPPED AT EVIDENCE</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.5s" fill="freeze"/>
      <rect x="670" y="326" width="8" height="8" fill="#4a86f7"/>
      <text x="690" y="334" fill="#c9d5e4">silent regression</text>
      <text x="900" y="334" fill="#7aa5f9">STOPPED AT EVALUATION</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="6.3s" fill="freeze"/>
      <rect x="670" y="350" width="8" height="8" fill="#ff7a5c"/>
      <text x="690" y="358" fill="#c9d5e4">production drift</text>
      <text x="900" y="358" fill="#ff9d85">STOPPED AT OBSERVABILITY</text>
    </g>
  </g>
</svg>
