<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="A universe in every layer. Seven concentric rings light from a violet core outward while a moon in the sky waxes from new to full. At full moon a Rinne Sharingan opens on it, a pupil inside three ripple rings carrying nine tomoe, and red light breaks across the sky. The rings are seven layers of work across sixteen repositories: learning core, data, models, applied AI, agents, knowledge and quantum.">
  <!--
    One 24 second cycle, repeating forever. It repeats on purpose: this panel sits
    far down the page, so a reveal that played once at page load would always be
    over before anyone scrolled to it.

    Read as fractions of the 24s cycle, which is how every keyTimes list below is written:
      0.030 - 0.075  the core ignites
      0.075 - 0.246  seven rings light, inner to outer, one every half second
      0.030 - 0.460  the moon waxes, new to full, slowly. This is the long beat.
      0.460 - 0.500  full moon. The rings dim and the pale halo swells: the inhale
                     before the burst. Nothing else moves. This pause is the reason
                     the next beat lands at all.
      0.500 - 0.528  the Rinne Sharingan opens on the moon and the moon goes red
      0.528 - 0.560  the burst: white flash, two shockwaves, light down onto the world
      0.560 - 0.940  held in the red. The tomoe turn, the beams breathe
      0.940 - 1.000  fades out and begins again
  -->
  <defs>
    <radialGradient id="cc-sky" cx="34%" cy="78%" r="95%">
      <stop offset="0%" stop-color="#1b0f3a" />
      <stop offset="45%" stop-color="#0d0722" />
      <stop offset="100%" stop-color="#050310" />
    </radialGradient>
    <!-- the violet core, lit from upper left so it reads as a sphere and not a disc -->
    <radialGradient id="cc-core" cx="36%" cy="32%">
      <stop offset="0%" stop-color="#f6ecff" />
      <stop offset="22%" stop-color="#d3b4ff" />
      <stop offset="52%" stop-color="#9a63ef" />
      <stop offset="80%" stop-color="#5a24b4" />
      <stop offset="100%" stop-color="#2b0c63" />
    </radialGradient>
    <radialGradient id="cc-coreRed" cx="36%" cy="32%">
      <stop offset="0%" stop-color="#fff1e6" />
      <stop offset="22%" stop-color="#ff9d7a" />
      <stop offset="52%" stop-color="#e33b2e" />
      <stop offset="80%" stop-color="#8c1020" />
      <stop offset="100%" stop-color="#3d0512" />
    </radialGradient>
    <radialGradient id="cc-dawn" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f4e8ff" stop-opacity="0.42" />
      <stop offset="35%" stop-color="#a36bf3" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#5c2aaf" stop-opacity="0" />
    </radialGradient>
    <!-- the moon: cold before, blood after -->
    <radialGradient id="cc-moonlit" cx="34%" cy="30%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#eee6ff" />
      <stop offset="100%" stop-color="#b9a6dd" />
    </radialGradient>
    <radialGradient id="cc-moonred" cx="44%" cy="40%">
      <stop offset="0%" stop-color="#ffc182" />
      <stop offset="18%" stop-color="#ff7734" />
      <stop offset="55%" stop-color="#d9231a" />
      <stop offset="100%" stop-color="#7c0b13" />
    </radialGradient>
    <radialGradient id="cc-moonhalo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffe9d2" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#c9a6ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7a3cf0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cc-redhalo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff0e2" stop-opacity="0.72" />
      <stop offset="26%" stop-color="#ff5a2e" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#8e0f16" stop-opacity="0" />
    </radialGradient>
    <!-- the world after. Hottest at the moon, bled out to the corners -->
    <radialGradient id="cc-genjutsu" cx="52%" cy="22%" r="96%">
      <stop offset="0%" stop-color="#ff6a3a" stop-opacity="0.50" />
      <stop offset="28%" stop-color="#dc2b25" stop-opacity="0.40" />
      <stop offset="66%" stop-color="#7c1024" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#2a0410" stop-opacity="0.40" />
    </radialGradient>
    <linearGradient id="cc-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff3e6" stop-opacity="0.85" />
      <stop offset="18%" stop-color="#ff7a44" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#ff3a20" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cc-vig" cx="44%" cy="54%" r="76%">
      <stop offset="52%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#01000a" stop-opacity="0.62" />
    </radialGradient>
    <linearGradient id="cc-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a34cf" stop-opacity="0" />
      <stop offset="35%" stop-color="#c6a2fb" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#f4e8ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#6a34cf" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cc-spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a34cf" />
      <stop offset="100%" stop-color="#f4e8ff" />
    </linearGradient>
    <filter id="cc-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <clipPath id="cc-above" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" d="M0,0 H1200 V700 H0 Z M2450,2400 a1850,1850 0 1,0 -3700,0 a1850,1850 0 1,0 3700,0" />
    </clipPath>
    <!-- The phase. A shadow disc slightly larger than the moon starts dead on centre,
         which is new moon, and slides off to the left to wax it to full. Eased, because
         a linear slide reads as a wipe rather than as something turning in space. -->
    <mask id="cc-eclipse">
      <circle cx="620" cy="162" r="62" fill="#ffffff" />
      <circle cy="162" r="65" fill="#000000" cx="493"></circle>
    </mask>
    <path id="cc-tomoe" d="M0,0 a5,5 0 1,0 0.01,0 Z M-3.4,-3.6 C-11,-1.6 -17,4.4 -19,13.4 C-14,5.4 -8,1.4 -1.2,-0.6 Z" />
    <path id="cc-beamray" d="M0,0 L1560,-30 L1560,30 Z" />
  </defs>
  <rect width="1200" height="700" fill="url(#cc-sky)" />
  <g fill="#cbbdf0">
    <circle cx="88" cy="96" r="1.3" opacity="0.25"></circle>
    <circle cx="163" cy="212" r="1" opacity="0.2"></circle>
    <circle cx="246" cy="74" r="1.5" opacity="0.3"></circle>
    <circle cx="318" cy="168" r="0.9" opacity="0.45" />
    <circle cx="452" cy="62" r="1.2" opacity="0.25"></circle>
    <circle cx="536" cy="140" r="1" opacity="0.5" />
    <circle cx="424" cy="252" r="1.4" opacity="0.3"></circle>
    <circle cx="700" cy="88" r="1.1" opacity="0.55" />
    <circle cx="726" cy="330" r="1.3" opacity="0.2"></circle>
    <circle cx="120" cy="330" r="1.1" opacity="0.2"></circle>
    <circle cx="58" cy="452" r="1" opacity="0.45" />
    <circle cx="196" cy="470" r="0.9" opacity="0.4" />
    <circle cx="372" cy="118" r="0.9" opacity="0.45" />
    <circle cx="284" cy="292" r="1" opacity="0.2"></circle>
  </g>
  <g clip-path="url(#cc-above)">
    <!-- the core ignites first: foundations at the centre -->
    <g opacity="1">
      <circle cx="400" cy="520" r="300" fill="url(#cc-dawn)" />
      <circle cx="400" cy="520" r="46" fill="url(#cc-core)" />
      <g fill="#ffffff" opacity="0.10">
        <ellipse cx="386" cy="504" rx="16" ry="9" transform="rotate(-24 386 504)" />
        <ellipse cx="412" cy="536" rx="11" ry="6" transform="rotate(18 412 536)" />
      </g>
      <circle cx="400" cy="520" r="46" fill="url(#cc-coreRed)" opacity="0.92"></circle>
      <circle cx="400" cy="520" r="46" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.35" />
    </g>
    <!-- seven layers. pathLength must sit on each circle: it is NOT inherited from a <g> -->
    <g fill="none" stroke-linecap="round" opacity="1">
      <circle cx="400" cy="520" r="55" stroke="#f4e8ff" stroke-width="2.6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="100" stroke="#ddc4ff" stroke-width="2.4" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="145" stroke="#c6a2fb" stroke-width="2.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="190" stroke="#ae82f5" stroke-width="2.1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="235" stroke="#9764ee" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="280" stroke="#8049e2" stroke-width="1.9" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="325" stroke="#6a34cf" stroke-width="1.8" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
    </g>
    <!-- the same seven rings again in red, brought up by the genjutsu -->
    <g fill="none" stroke-linecap="round" opacity="0.78">
      <circle cx="400" cy="520" r="55" stroke="#ffd7c2" stroke-width="2.6" />
      <circle cx="400" cy="520" r="100" stroke="#ff9a72" stroke-width="2.4" />
      <circle cx="400" cy="520" r="145" stroke="#ff7048" stroke-width="2.2" />
      <circle cx="400" cy="520" r="190" stroke="#f4482c" stroke-width="2.1" />
      <circle cx="400" cy="520" r="235" stroke="#dc2b25" stroke-width="2" />
      <circle cx="400" cy="520" r="280" stroke="#b91c2a" stroke-width="1.9" />
      <circle cx="400" cy="520" r="325" stroke="#8e0f16" stroke-width="1.8" />
    </g>
    <!-- a charge running each lit ring -->
    <g fill="none" stroke-linecap="round" opacity="0.95">
      <circle cx="400" cy="520" r="100" stroke="#ffffff" stroke-width="2.6" pathLength="100" stroke-dasharray="4 96" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="190" stroke="#ffffff" stroke-width="2.4" pathLength="100" stroke-dasharray="4 96" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="325" stroke="#e8d4ff" stroke-width="2.2" pathLength="100" stroke-dasharray="4 96" stroke-dashoffset="0"></circle>
    </g>
    <!-- electron shells: the same drawing read as an atom -->
    <g opacity="1">
      <g fill="none" stroke="#a36bf3" stroke-width="1.1" opacity="0.34">
        <ellipse cx="400" cy="520" rx="300" ry="104" />
        <ellipse cx="400" cy="520" rx="300" ry="104" transform="rotate(60 400 520)" />
        <ellipse cx="400" cy="520" rx="300" ry="104" transform="rotate(120 400 520)" />
      </g>
      <g fill="#f4e8ff"></g>
    </g>
  </g>
  <!-- the planet -->
  <circle cx="600" cy="2400" r="1850" fill="#07030f" />
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="url(#cc-rim)" stroke-width="2.4" opacity="0.85" />
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="#c6a2fb" stroke-width="9" opacity="0.14" filter="url(#cc-glow)" />
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="#ff5a2e" stroke-width="5" opacity="0.5"></path>
  <g fill="#1c0f3c" stroke="#8049e2" stroke-width="1" opacity="0.5">
    <g transform="translate(96,604)">
      <path d="M0,22 C0,9 12,1 25,6 C31,-6 51,-6 58,6 C71,1 83,9 83,22 C83,33 70,40 58,35 C51,45 31,45 25,35 C12,40 0,33 0,22 Z" />
    </g>
    <g transform="translate(560,640)">
      <path d="M0,22 C0,9 12,1 25,6 C31,-6 51,-6 58,6 C71,1 83,9 83,22 C83,33 70,40 58,35 C51,45 31,45 25,35 C12,40 0,33 0,22 Z" />
    </g>
  </g>
  <rect width="1200" height="700" fill="url(#cc-vig)" />
  <text x="60" y="668" fill="#6f5f96" font-size="10.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">7 LAYERS · 16 REPOSITORIES · ALL MINE, NO FORKS · BUILT OUTWARD FROM THE CORE</text>
  <text x="748" y="62" fill="#c6a2fb" opacity="0.9" font-size="11" letter-spacing="3.2" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">SYSTEM MAP · NAMASHWORKS</text>
  <text x="748" y="104" fill="#f4e8ff" font-size="27" font-weight="600" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">A universe in every layer.</text>
  <text x="748" y="132" fill="#9a8bb8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Foundations at the centre. Frontiers at the edge.</text>
  <line x1="748" y1="152" x2="1160" y2="152" stroke="#2a1a52" stroke-width="1.2" />
  <g opacity="1">
    <rect x="748" y="182" width="10" height="10" fill="#6a34cf" />
    <text x="770" y="192" fill="#8f6ae0" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">QUANTUM</text>
    <text x="770" y="210" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">qledger</text>
  </g>
  <g opacity="1">
    <rect x="748" y="250" width="10" height="10" fill="#8049e2" />
    <text x="770" y="260" fill="#8049e2" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">KNOWLEDGE</text>
    <text x="770" y="278" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">egkg-architecture · StudyMate</text>
  </g>
  <g opacity="1">
    <rect x="748" y="318" width="10" height="10" fill="#9764ee" />
    <text x="770" y="328" fill="#9764ee" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">AGENTS</text>
    <text x="770" y="346" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Bridge-ADK · IPipe · Chatform</text>
  </g>
  <g opacity="1">
    <rect x="748" y="386" width="10" height="10" fill="#ae82f5" />
    <text x="770" y="396" fill="#ae82f5" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">APPLIED AI</text>
    <text x="770" y="414" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Genz-medical-advisor · Successapp · autoRECON</text>
  </g>
  <g opacity="1">
    <rect x="748" y="454" width="10" height="10" fill="#c6a2fb" />
    <text x="770" y="464" fill="#c6a2fb" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">MODELS</text>
    <text x="770" y="482" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Genetic-Transformer · FNet-Pytorch-Implementation</text>
  </g>
  <g opacity="1">
    <rect x="748" y="522" width="10" height="10" fill="#ddc4ff" />
    <text x="770" y="532" fill="#ddc4ff" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">DATA</text>
    <text x="770" y="550" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Json-to-Toon-converter · multiformat-toon</text>
    <text x="770" y="566" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Synthetic-Data-Generator-with-converter</text>
  </g>
  <g opacity="1">
    <rect x="748" y="608" width="10" height="10" fill="#f4e8ff" />
    <text x="770" y="618" fill="#f4e8ff" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">LEARNING CORE</text>
    <text x="770" y="636" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">stam-ml · movie-rating-prediction-ml-pipeline</text>
  </g>
  <line x1="748" y1="590" x2="1160" y2="590" stroke="#2a1a52" stroke-width="1.2" />
  <rect x="742" y="182" width="2" height="446" fill="url(#cc-spine)" opacity="0.35" />
  <!-- ============ everything below here is the genjutsu, and it sits above the page ============ -->
  <!-- light coming down off the moon onto the world -->
  <g transform="translate(620,162)" opacity="0.5">
    <g fill="url(#cc-beam)" transform="rotate(-3)">
      <use href="#cc-beamray" transform="rotate(100)" />
      <use href="#cc-beamray" transform="rotate(112)" />
      <use href="#cc-beamray" transform="rotate(124)" />
      <use href="#cc-beamray" transform="rotate(136)" />
      <use href="#cc-beamray" transform="rotate(148)" />
    </g>
  </g>
  <!-- the world turns over -->
  <rect width="1200" height="700" fill="url(#cc-genjutsu)" opacity="0.82"></rect>
  <text x="74" y="104" fill="#ff7a56" opacity="0.66" font-size="25" letter-spacing="1" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
    <tspan x="74" dy="0">無</tspan>
    <tspan x="74" dy="31">限</tspan>
    <tspan x="74" dy="31">月</tspan>
    <tspan x="74" dy="31">読</tspan>
  </text>
  <text x="74" y="232" fill="#c9736a" opacity="0.8" font-size="8.5" letter-spacing="2.2" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">MUGEN TSUKUYOMI</text>
  <!-- ============ the moon ============ -->
  <circle cx="620" cy="162" r="200" fill="url(#cc-moonhalo)" opacity="0.3"></circle>
  <circle cx="620" cy="162" r="260" fill="url(#cc-redhalo)" opacity="0.72"></circle>
  <g opacity="1">
    <!-- the unlit body, so a new moon is a hole in the sky rather than nothing at all -->
    <circle cx="620" cy="162" r="62" fill="#12082a" />
    <circle cx="620" cy="162" r="62" fill="none" stroke="#7a53c9" stroke-width="0.9" opacity="0.45" />
    <g mask="url(#cc-eclipse)">
      <circle cx="620" cy="162" r="62" fill="url(#cc-moonlit)" />
      <g fill="#b6a2da" opacity="0.42">
        <ellipse cx="598" cy="140" rx="17" ry="13" />
        <ellipse cx="635" cy="179" rx="12" ry="9" />
        <ellipse cx="608" cy="190" rx="8" ry="6.3" />
        <ellipse cx="642" cy="138" rx="7" ry="5.2" />
        <ellipse cx="588" cy="173" rx="5.7" ry="4.6" />
      </g>
      <circle cx="620" cy="162" r="62" fill="url(#cc-moonred)" opacity="1"></circle>
    </g>
    <!-- The Rinne Sharingan. A pupil inside three dotted ripple rings, nine tomoe, three
         to a ring, each ring turned 40 degrees off the last so they never line up into a
         spoke. The rings ripple OUTWARD from the pupil rather than being drawn round,
         which is the Rinnegan's own motion and keeps the dotted pattern intact: a
         stroke-dasharray wipe would have to overwrite the dots to work. -->
    <g opacity="1">
      <g fill="none" stroke="#280409" stroke-width="1.9" stroke-dasharray="1.9 3">
        <circle cx="620" cy="162" r="18" opacity="0.95"></circle>
        <circle cx="620" cy="162" r="32" opacity="0.95"></circle>
        <circle cx="620" cy="162" r="46" opacity="0.95"></circle>
      </g>
      <circle cx="620" cy="162" r="6.6" fill="#280409" />
      <g fill="#22040a" opacity="1" transform="rotate(360 620 162)">
        <use href="#cc-tomoe" transform="translate(623.1,144.3) rotate(10) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(633.8,173.6) rotate(130) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(603.1,168.2) rotate(250) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(644.5,141.4) rotate(50) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(625.6,193.5) rotate(170) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(589.9,151.1) rotate(290) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(666.0,162.0) rotate(90) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(597.0,201.8) rotate(210) scale(0.58)" />
        <use href="#cc-tomoe" transform="translate(597.0,122.2) rotate(330) scale(0.58)" />
      </g>
    </g>
    <circle cx="620" cy="162" r="62" fill="none" stroke="#ffb499" stroke-width="1" opacity="0.45"></circle>
  </g>
  <!-- ============ the burst ============ -->
  <circle cx="620" cy="162" r="1500" fill="none" stroke="#ff3a1e" stroke-width="0" opacity="1"></circle>
  <!-- the lens cross. One beat of it, which is what sells a flash as light and not paint -->
</svg>