<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="A universe in every layer. A moon rises from behind a planet's limb through its phases while seven concentric rings light from the centre outward. At full moon nine seals lock onto the rings and dawn light breaks across the sky. The rings are seven layers of work across sixteen repositories: learning core, data, models, applied AI, agents, knowledge and quantum.">
  <defs>
    <radialGradient id="cc-sky" cx="34%" cy="78%" r="95%">
      <stop offset="0%" stop-color="#1b0f3a" />
      <stop offset="45%" stop-color="#0d0722" />
      <stop offset="100%" stop-color="#050310" />
    </radialGradient>
    <radialGradient id="cc-dawn" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f4e8ff" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#a36bf3" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#5c2aaf" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cc-moon" cx="38%" cy="34%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#efe4ff" />
      <stop offset="100%" stop-color="#c4aee8" />
    </radialGradient>
    <radialGradient id="cc-bleed" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ff8a5c" stop-opacity="0.34" />
      <stop offset="38%" stop-color="#b4485f" stop-opacity="0.19" />
      <stop offset="78%" stop-color="#4a1e3c" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#3a0618" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cc-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a34cf" stop-opacity="0" />
      <stop offset="35%" stop-color="#c6a2fb" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#f4e8ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#6a34cf" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cc-spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a34cf" />
      <stop offset="100%" stop-color="#f4e8ff" />
    </linearGradient>
    <filter id="cc-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="cc-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>
    <clipPath id="cc-above" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" d="M0,0 H1200 V700 H0 Z M2450,2400 a1850,1850 0 1,0 -3700,0 a1850,1850 0 1,0 3700,0" />
    </clipPath>
    <!-- the terminator: a shadow sliding clear of the disc, new moon to full -->
    <mask id="cc-phase">
      <circle cx="400" cy="520" r="46" fill="#ffffff" />
      <circle cy="520" r="50" fill="#000000" cx="534"></circle>
    </mask>
    <path id="cc-tomoe" d="M0,0 a5,5 0 1,0 0.01,0 Z M-3.4,-3.6 C-11,-1.6 -17,4.4 -19,13.4 C-14,5.4 -8,1.4 -1.2,-0.6 Z" />
  </defs>
  <rect width="1200" height="700" fill="url(#cc-sky)" />
  <g fill="#cbbdf0">
    <circle cx="88" cy="96" r="1.3" opacity="0.7"></circle>
    <circle cx="163" cy="212" r="1" opacity="0.5"></circle>
    <circle cx="246" cy="74" r="1.5" opacity="0.8"></circle>
    <circle cx="318" cy="168" r="0.9" opacity="0.45" />
    <circle cx="452" cy="62" r="1.2" opacity="0.65"></circle>
    <circle cx="536" cy="140" r="1" opacity="0.5" />
    <circle cx="604" cy="252" r="1.4" opacity="0.75"></circle>
    <circle cx="676" cy="88" r="1.1" opacity="0.55" />
    <circle cx="720" cy="330" r="1.3" opacity="0.6"></circle>
    <circle cx="120" cy="330" r="1.1" opacity="0.5"></circle>
    <circle cx="58" cy="452" r="1" opacity="0.45" />
    <circle cx="196" cy="470" r="0.9" opacity="0.4" />
    <circle cx="372" cy="118" r="0.9" opacity="0.45" />
    <circle cx="640" cy="186" r="0.9" opacity="0.4" />
    <circle cx="284" cy="292" r="1" opacity="0.5"></circle>
  </g>
  <g clip-path="url(#cc-above)">
    <!-- the moon, rising and waxing -->
    <g opacity="1">
      <circle cx="400" cy="520" r="300" fill="url(#cc-dawn)" />
      <g mask="url(#cc-phase)">
        <circle cx="400" cy="520" r="46" fill="url(#cc-moon)" />
        <g fill="#c9b4e6" opacity="0.45">
          <ellipse cx="384" cy="504" rx="13" ry="10" />
          <ellipse cx="411" cy="533" rx="9" ry="7" />
          <ellipse cx="392" cy="540" rx="6" ry="5" />
          <ellipse cx="416" cy="503" rx="5" ry="4" />
        </g>
        <!-- the moon turns as the seal takes it -->
        <circle cx="400" cy="520" r="46" fill="#d4744f" opacity="0.62"></circle>
        <circle cx="400" cy="520" r="46" fill="url(#cc-moon)" opacity="0.18"></circle>
      </g>
      <circle cx="400" cy="520" r="46" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.35" />
    </g>
    <!-- seven layers, lighting inner to outer -->
    <g fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round">
      <circle cx="400" cy="520" r="55" stroke="#f4e8ff" stroke-width="2.6" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="100" stroke="#ddc4ff" stroke-width="2.4" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="145" stroke="#c6a2fb" stroke-width="2.2" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="190" stroke="#ae82f5" stroke-width="2.1" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="235" stroke="#9764ee" stroke-width="2" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="280" stroke="#8049e2" stroke-width="1.9" stroke-dashoffset="0"></circle>
      <circle cx="400" cy="520" r="325" stroke="#6a34cf" stroke-width="1.8" stroke-dashoffset="0"></circle>
    </g>
    <g fill="none" pathLength="100" stroke-dasharray="4 96" stroke-linecap="round" opacity="0.95">
      <circle cx="400" cy="520" r="100" stroke="#ffffff" stroke-width="2.6"></circle>
      <circle cx="400" cy="520" r="190" stroke="#ffffff" stroke-width="2.4"></circle>
      <circle cx="400" cy="520" r="325" stroke="#e8d4ff" stroke-width="2.2"></circle>
    </g>
    <!-- electron shells: the same drawing read as an atom -->
    <g fill="none" stroke="#a36bf3" stroke-width="1.1" opacity="0.34">
      <ellipse cx="400" cy="520" rx="300" ry="104" />
      <ellipse cx="400" cy="520" rx="300" ry="104" transform="rotate(60 400 520)" />
      <ellipse cx="400" cy="520" rx="300" ry="104" transform="rotate(120 400 520)" />
    </g>
    <g fill="#f4e8ff"></g>
    <!-- nine seals lock on at full moon: three inner, six outer -->
    <g opacity="0.85">
      <g fill="#2e1338">
        <use href="#cc-tomoe" transform="translate(400,375)" />
        <use href="#cc-tomoe" transform="translate(525.6,447.5) rotate(60)" />
        <use href="#cc-tomoe" transform="translate(274.4,447.5) rotate(-60)" />
      </g>
      <g fill="#3a1a44">
        <use href="#cc-tomoe" transform="translate(400,240) scale(0.85)" />
        <use href="#cc-tomoe" transform="translate(642.5,380) rotate(60) scale(0.85)" />
        <use href="#cc-tomoe" transform="translate(642.5,660) rotate(120) scale(0.85)" />
        <use href="#cc-tomoe" transform="translate(400,800) rotate(180) scale(0.85)" />
        <use href="#cc-tomoe" transform="translate(157.5,660) rotate(240) scale(0.85)" />
        <use href="#cc-tomoe" transform="translate(157.5,380) rotate(300) scale(0.85)" />
      </g>
    </g>
    <!-- the light breaks: dawn, which is what Akatsuki means -->
    <circle cx="400" cy="520" r="980" fill="none" stroke="#ffa06b" stroke-width="0" opacity="0"></circle>
    <circle cx="400" cy="520" r="700" fill="none" stroke="#ffe3d2" stroke-width="0" opacity="0"></circle>
    <!-- and holds: a crimson bleed that falls off before the legend -->
    <rect x="-60" y="0" width="920" height="700" fill="url(#cc-bleed)" opacity="0.34"></rect>
  </g>
  <!-- the planet -->
  <circle cx="600" cy="2400" r="1850" fill="#07030f" />
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="url(#cc-rim)" stroke-width="2.4" opacity="0.85" />
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="#c6a2fb" stroke-width="9" opacity="0.14" filter="url(#cc-glow)" />
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="#ff9366" stroke-width="5" opacity="0.24"></path>
  <!-- dawn clouds. Akatsuki means dawn -->
  <g fill="#1c0f3c" stroke="#8049e2" stroke-width="1" opacity="0.5">
    <g transform="translate(96,604) scale(0.9)">
      <path d="M0,22 C0,9 12,1 25,6 C31,-6 51,-6 58,6 C71,1 83,9 83,22 C83,33 70,40 58,35 C51,45 31,45 25,35 C12,40 0,33 0,22 Z" />
    </g>
    <g transform="translate(560,640) scale(0.7)">
      <path d="M0,22 C0,9 12,1 25,6 C31,-6 51,-6 58,6 C71,1 83,9 83,22 C83,33 70,40 58,35 C51,45 31,45 25,35 C12,40 0,33 0,22 Z" />
    </g>
  </g>
  <text x="60" y="668" fill="#6f5f96" font-size="10.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">7 LAYERS · 16 REPOSITORIES · ALL MINE, NO FORKS · BUILT OUTWARD FROM THE CORE</text>
  <text x="748" y="62" fill="#c6a2fb" opacity="0.9" font-size="11" letter-spacing="3.2" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">SYSTEM MAP · NAMASHWORKS</text>
  <text x="748" y="104" fill="#f4e8ff" font-size="27" font-weight="600" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">A universe in every layer.</text>
  <text x="748" y="132" fill="#9a8bb8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Foundations at the centre. Frontiers at the edge.</text>
  <line x1="748" y1="152" x2="1160" y2="152" stroke="#2a1a52" stroke-width="1.2" />
  <g opacity="1">
    <rect x="748" y="182" width="10" height="10" fill="#6a34cf" />
    <text x="770" y="192" fill="#8f6ae0" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">QUANTUM</text>
    <text x="770" y="210" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">qledger</text>
  </g>
  <g opacity="1">
    <rect x="748" y="250" width="10" height="10" fill="#8049e2" />
    <text x="770" y="260" fill="#8049e2" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">KNOWLEDGE</text>
    <text x="770" y="278" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">egkg-architecture · StudyMate</text>
  </g>
  <g opacity="1">
    <rect x="748" y="318" width="10" height="10" fill="#9764ee" />
    <text x="770" y="328" fill="#9764ee" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">AGENTS</text>
    <text x="770" y="346" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Bridge-ADK · IPipe · Chatform</text>
  </g>
  <g opacity="1">
    <rect x="748" y="386" width="10" height="10" fill="#ae82f5" />
    <text x="770" y="396" fill="#ae82f5" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">APPLIED AI</text>
    <text x="770" y="414" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Genz-medical-advisor · Successapp · autoRECON</text>
  </g>
  <g opacity="1">
    <rect x="748" y="454" width="10" height="10" fill="#c6a2fb" />
    <text x="770" y="464" fill="#c6a2fb" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">MODELS</text>
    <text x="770" y="482" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Genetic-Transformer · FNet-Pytorch-Implementation</text>
  </g>
  <g opacity="1">
    <rect x="748" y="522" width="10" height="10" fill="#ddc4ff" />
    <text x="770" y="532" fill="#ddc4ff" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">DATA</text>
    <text x="770" y="550" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Json-to-Toon-converter · multiformat-toon</text>
    <text x="770" y="566" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Synthetic-Data-Generator-with-converter</text>
  </g>
  <g opacity="1">
    <rect x="748" y="608" width="10" height="10" fill="#f4e8ff" />
    <text x="770" y="618" fill="#f4e8ff" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">LEARNING CORE</text>
    <text x="770" y="636" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">stam-ml · movie-rating-prediction-ml-pipeline</text>
  </g>
  <line x1="748" y1="590" x2="1160" y2="590" stroke="#2a1a52" stroke-width="1.2" />
  <rect x="742" y="182" width="2" height="446" fill="url(#cc-spine)" opacity="0.35" />
</svg>