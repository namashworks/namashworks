<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Three shield layers with patrolling monitor drones. Three incoming threats are intercepted: an unsourced claim stopped at the evidence layer, a silent regression stopped at the evaluation layer, and production drift stopped at the observability layer.">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b1c" />
      <stop offset="60%" stop-color="#0a1330" />
      <stop offset="100%" stop-color="#101c40" />
    </linearGradient>
    <pattern id="dl-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05" />
    </pattern>
    <radialGradient id="dl-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#4fd6c8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#4fd6c8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dl-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fd6c8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#4fd6c8" stop-opacity="0" />
    </linearGradient>
    <filter id="dl-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>
  <rect width="1200" height="380" fill="url(#dl-bg)" />
  <circle cx="330" cy="430" r="380" fill="url(#dl-glow)" />
  <rect width="1200" height="380" fill="url(#dl-scan)" />
  <g stroke="#4fd6c8" stroke-width="1.6" fill="none" opacity="0.42">
    <path d="M16,44 V16 H44" />
    <path d="M1156,16 H1184 V44" />
    <path d="M1184,336 V364 H1156" />
    <path d="M44,364 H16 V336" />
  </g>
  <text x="56" y="40" fill="#4fd6c8" opacity="0.9" font-size="11" letter-spacing="3.2" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">DEFENCE IN DEPTH · FOR AI SYSTEMS</text>
  <text x="30" y="110" fill="#4fd6c8" opacity="0.13" font-size="13" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
    <tspan x="30" dy="0">シ</tspan>
    <tspan x="30" dy="18">ー</tspan>
    <tspan x="30" dy="18">ル</tspan>
    <tspan x="30" dy="18">ド</tspan>
  </text>
  <!-- the three shields -->
  <g fill="none" stroke-linecap="round">
    <path id="dl-outer" d="M40.2,352.3 A300,300 0 0 1 619.8,352.3" stroke="#4fd6c8" stroke-width="2.6" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></path>
    <path id="dl-mid" d="M102.9,369.2 A235,235 0 0 1 557.1,369.2" stroke="#4a86f7" stroke-width="2.6" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></path>
    <path id="dl-inner" d="M165.7,386 A170,170 0 0 1 494.3,386" stroke="#ff7a5c" stroke-width="2.6" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></path>
  </g>
  <!-- a charge circulating in each shield -->
  <g fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M40.2,352.3 A300,300 0 0 1 619.8,352.3" stroke="#c9fff8" stroke-width="2.6" pathLength="100" stroke-dasharray="6 94"></path>
    <path d="M102.9,369.2 A235,235 0 0 1 557.1,369.2" stroke="#cfe0ff" stroke-width="2.6" pathLength="100" stroke-dasharray="6 94"></path>
    <path d="M165.7,386 A170,170 0 0 1 494.3,386" stroke="#ffd2c6" stroke-width="2.6" pathLength="100" stroke-dasharray="6 94"></path>
  </g>
  <!-- three incoming threats, each stopped by a different layer -->
  <!-- A: an unsourced claim, stopped at the outer shield -->
  <!-- B: a silent regression, gets past the outer shield, stopped at evaluation -->
  <!-- C: production drift, gets past both, stopped at observability -->
  <!-- the interceptions -->
  <g fill="none" stroke-width="2.2">
    <circle cx="100.2" cy="237.2" r="0" stroke="#4fd6c8"></circle>
    <circle cx="269.1" cy="203" r="0" stroke="#4a86f7"></circle>
    <circle cx="401.8" cy="275.9" r="0" stroke="#ff7a5c"></circle>
  </g>
  <g filter="url(#dl-soft)">
    <circle cx="100.2" cy="237.2" r="13" fill="#c9fff8" opacity="1"></circle>
    <circle cx="269.1" cy="203" r="13" fill="#cfe0ff" opacity="0"></circle>
    <circle cx="401.8" cy="275.9" r="13" fill="#ffd2c6" opacity="0"></circle>
  </g>
  <!-- monitor drones on patrol, one per shield -->
  <!-- what each layer is for -->
  <g opacity="1">
    <circle cx="668" cy="83" r="6" fill="#4fd6c8"></circle>
    <text x="688" y="88" fill="#4fd6c8" font-size="14" letter-spacing="2.6" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">EVIDENCE</text>
    <text x="688" y="109" fill="#94a3b8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Nothing enters a system of mine without a source I can point at.</text>
  </g>
  <g opacity="1">
    <circle cx="668" cy="145" r="6" fill="#4a86f7"></circle>
    <text x="688" y="150" fill="#7aa5f9" font-size="14" letter-spacing="2.6" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">EVALUATION</text>
    <text x="688" y="171" fill="#94a3b8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">What comes out is measured against a baseline, not a feeling.</text>
  </g>
  <g opacity="1">
    <circle cx="668" cy="207" r="6" fill="#ff7a5c"></circle>
    <text x="688" y="212" fill="#ff9d85" font-size="14" letter-spacing="2.6" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">OBSERVABILITY</text>
    <text x="688" y="233" fill="#94a3b8" font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">When it drifts in production, the logs say so before a user does.</text>
  </g>
  <!-- intercept log -->
  <line x1="668" y1="258" x2="1150" y2="258" stroke="#1c3247" stroke-width="1.2" />
  <circle cx="674" cy="278" r="3.4" fill="#4fd6c8"></circle>
  <text x="688" y="282" fill="#475569" font-size="10.5" letter-spacing="2" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">INTERCEPT LOG · 3 SHIELDS UP · 3 MONITORS PATROLLING</text>
  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12">
    <g opacity="1">
      <rect x="670" y="302" width="8" height="8" fill="#4fd6c8" />
      <text x="690" y="310" fill="#c9d5e4">unsourced claim</text>
      <text x="900" y="310" fill="#4fd6c8">STOPPED AT EVIDENCE</text>
    </g>
    <g opacity="1">
      <rect x="670" y="326" width="8" height="8" fill="#4a86f7" />
      <text x="690" y="334" fill="#c9d5e4">silent regression</text>
      <text x="900" y="334" fill="#7aa5f9">STOPPED AT EVALUATION</text>
    </g>
    <g opacity="1">
      <rect x="670" y="350" width="8" height="8" fill="#ff7a5c" />
      <text x="690" y="358" fill="#c9d5e4">production drift</text>
      <text x="900" y="358" fill="#ff9d85">STOPPED AT OBSERVABILITY</text>
    </g>
  </g>
</svg>