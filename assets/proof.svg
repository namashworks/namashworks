<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="This README is checked by a test suite that ships with it: 304 checks in 18 groups, 45 more against the published page, and zero third party requests.">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="60%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#141d3a"/>
    </linearGradient>
    <radialGradient id="pf-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pf-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- claim: checks=304 groups=18 live=45
       These are the numbers drawn on the panel. Group 18 of the suite parses this
       line and fails if it has drifted from what the suite actually runs, so the
       panel cannot quietly start overstating itself. -->
  <rect width="1200" height="360" fill="url(#pf-bg)"/>
  <circle cx="330" cy="190" r="300" fill="url(#pf-glow)"/>
  <rect width="1200" height="360" fill="url(#pf-scan)"/>

  <g stroke="#22d3ee" stroke-width="1.6" fill="none" opacity="0.45">
    <path d="M16,44 V16 H44"/><path d="M1156,16 H1184 V44"/>
    <path d="M1184,316 V344 H1156"/><path d="M44,344 H16 V316"/>
    <animate attributeName="opacity" values="0.45;0.82;0.45" dur="4.1s" repeatCount="indefinite"/>
  </g>

  <text x="30" y="120" fill="#22d3ee" opacity="0.13" font-size="13"
        font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
    <tspan x="30" dy="0">自</tspan><tspan x="30" dy="18">動</tspan><tspan x="30" dy="18">検</tspan><tspan x="30" dy="18">証</tspan>
  </text>

  <text x="60" y="44" fill="#22d3ee" opacity="0.85" font-size="11" letter-spacing="3.2"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">VERIFICATION · THIS PAGE IS TESTED LIKE A BUILD</text>

  <!-- the run log. Each row is a real group in tools/test.mjs, in the order it runs. -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5">

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.5s" begin="0.50s" fill="freeze"/>
      <path d="M68,100 l5,6 l10,-13" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" keyTimes="0;1" dur="0.42s" begin="0.60s" fill="freeze"/>
      </path>
      <text x="98" y="104" fill="#c9d5e4">encoding and house style</text>
      <path d="M400,100 H530" stroke="#243049" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="600" y="104" text-anchor="end" fill="#4ade80" font-size="11" letter-spacing="2"
            font-family="'JetBrains Mono','SF Mono',Consolas,monospace">PASS</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.5s" begin="0.85s" fill="freeze"/>
      <path d="M68,134 l5,6 l10,-13" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" keyTimes="0;1" dur="0.42s" begin="0.95s" fill="freeze"/>
      </path>
      <text x="98" y="138" fill="#c9d5e4">reduced motion has a still twin</text>
      <path d="M400,134 H530" stroke="#243049" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="600" y="138" text-anchor="end" fill="#4ade80" font-size="11" letter-spacing="2"
            font-family="'JetBrains Mono','SF Mono',Consolas,monospace">PASS</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.5s" begin="1.20s" fill="freeze"/>
      <path d="M68,168 l5,6 l10,-13" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" keyTimes="0;1" dur="0.42s" begin="1.30s" fill="freeze"/>
      </path>
      <text x="98" y="172" fill="#c9d5e4">no third party dependencies</text>
      <path d="M400,168 H530" stroke="#243049" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="600" y="172" text-anchor="end" fill="#4ade80" font-size="11" letter-spacing="2"
            font-family="'JetBrains Mono','SF Mono',Consolas,monospace">PASS</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.5s" begin="1.55s" fill="freeze"/>
      <path d="M68,202 l5,6 l10,-13" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" keyTimes="0;1" dur="0.42s" begin="1.65s" fill="freeze"/>
      </path>
      <text x="98" y="206" fill="#c9d5e4">the SQL is executed, not asserted</text>
      <path d="M400,202 H530" stroke="#243049" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="600" y="206" text-anchor="end" fill="#4ade80" font-size="11" letter-spacing="2"
            font-family="'JetBrains Mono','SF Mono',Consolas,monospace">PASS</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.5s" begin="1.90s" fill="freeze"/>
      <path d="M68,236 l5,6 l10,-13" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" keyTimes="0;1" dur="0.42s" begin="2.00s" fill="freeze"/>
      </path>
      <text x="98" y="240" fill="#c9d5e4">corrected claims stay corrected</text>
      <path d="M400,236 H530" stroke="#243049" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="600" y="240" text-anchor="end" fill="#4ade80" font-size="11" letter-spacing="2"
            font-family="'JetBrains Mono','SF Mono',Consolas,monospace">PASS</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.5s" begin="2.25s" fill="freeze"/>
      <path d="M68,270 l5,6 l10,-13" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" keyTimes="0;1" dur="0.42s" begin="2.35s" fill="freeze"/>
      </path>
      <text x="98" y="274" fill="#c9d5e4">the SMIL is valid, not discarded</text>
      <path d="M400,270 H530" stroke="#243049" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="600" y="274" text-anchor="end" fill="#4ade80" font-size="11" letter-spacing="2"
            font-family="'JetBrains Mono','SF Mono',Consolas,monospace">PASS</text>
    </g>
  </g>

  <path d="M660,76 V312" stroke="#243049" stroke-width="1"/>

  <!-- counters. Discrete steps, so the number ticks up instead of sliding. -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace">

    <g fill="#e6edf3" font-size="46" font-weight="700">
      <text x="700" y="138" opacity="0">
        <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.18;1" dur="3s" begin="0.7s" calcMode="discrete" fill="freeze"/>0</text>
      <text x="700" y="138" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.18;0.36;1" dur="3s" begin="0.7s" calcMode="discrete" fill="freeze"/>68</text>
      <text x="700" y="138" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.36;0.54;1" dur="3s" begin="0.7s" calcMode="discrete" fill="freeze"/>142</text>
      <text x="700" y="138" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.54;0.72;1" dur="3s" begin="0.7s" calcMode="discrete" fill="freeze"/>215</text>
      <text x="700" y="138" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.72;0.88;1" dur="3s" begin="0.7s" calcMode="discrete" fill="freeze"/>273</text>
      <text x="700" y="138" opacity="0" fill="#4ade80">
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.88;1" dur="3s" begin="0.7s" calcMode="discrete" fill="freeze"/>304</text>
    </g>
    <text x="700" y="162" fill="#64748b" font-size="11" letter-spacing="2" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.6s" begin="0.7s" fill="freeze"/>CHECKS, IN 18 GROUPS</text>

    <g fill="#e6edf3" font-size="46" font-weight="700">
      <text x="700" y="216" opacity="0">
        <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.2;1" dur="3s" begin="0.9s" calcMode="discrete" fill="freeze"/>0</text>
      <text x="700" y="216" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2;0.42;1" dur="3s" begin="0.9s" calcMode="discrete" fill="freeze"/>13</text>
      <text x="700" y="216" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.42;0.64;1" dur="3s" begin="0.9s" calcMode="discrete" fill="freeze"/>28</text>
      <text x="700" y="216" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.64;0.86;1" dur="3s" begin="0.9s" calcMode="discrete" fill="freeze"/>38</text>
      <text x="700" y="216" opacity="0" fill="#4ade80">
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.86;1" dur="3s" begin="0.9s" calcMode="discrete" fill="freeze"/>45</text>
    </g>
    <text x="700" y="240" fill="#64748b" font-size="11" letter-spacing="2" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.6s" begin="0.9s" fill="freeze"/>MORE, AGAINST THE PUBLISHED PAGE</text>

    <text x="700" y="294" fill="#4ade80" font-size="46" font-weight="700" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.6s" begin="3.9s" fill="freeze"/>0</text>
    <text x="700" y="318" fill="#64748b" font-size="11" letter-spacing="2" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.6s" begin="3.9s" fill="freeze"/>THIRD PARTY REQUESTS ON THIS PAGE</text>
  </g>

  <text x="60" y="316" fill="#475569" font-size="11" letter-spacing="1.8" opacity="0"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.7s" begin="2.8s" fill="freeze"/>THE SUITE SHIPS HERE · node tools/test.mjs</text>

  <text x="60" y="344" fill="#475569" font-size="11" letter-spacing="1.8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">RELIABILITY IS THE ARGUMENT, SO THE PAGE MAKING IT IS HELD TO THE SAME BAR</text>
</svg>
