<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Toolbox: Python, SQL, SQLite, JavaScript, pandas, NumPy; PyTorch, Transformers, LoRA and PEFT, scikit-learn; Google ADK, OpenAI Agents SDK, Claude Agent SDK, A2A; Qiskit, Cirq, PennyLane; Git, GitHub Actions, Jupyter, tests and reproducible examples">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a18"/><stop offset="60%" stop-color="#0b1226"/><stop offset="100%" stop-color="#141d3a"/>
    </linearGradient>
    <pattern id="tb-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05"/>
    </pattern>
    <radialGradient id="tb-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#tb-bg)"/>
  <circle cx="900" cy="170" r="300" fill="url(#tb-glow)"/>
  <rect width="1200" height="340" fill="url(#tb-scan)"/>

  <g stroke="#22d3ee" stroke-width="1.6" fill="none" opacity="0.42">
    <path d="M16,44 V16 H44"/><path d="M1156,16 H1184 V44"/>
    <path d="M1184,296 V324 H1156"/><path d="M44,324 H16 V296"/>
    <animate attributeName="opacity" values="0.42;0.78;0.42" dur="4.8s" repeatCount="indefinite"/>
  </g>

  <text x="56" y="44" fill="#22d3ee" opacity="0.9" font-size="11" letter-spacing="3.2"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">TOOLBOX · WHAT IS ACTUALLY IN THE REPOSITORIES</text>
  <text x="30" y="118" fill="#22d3ee" opacity="0.13" font-size="13"
        font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
    <tspan x="30" dy="0">ツ</tspan><tspan x="30" dy="18">ー</tspan><tspan x="30" dy="18">ル</tspan>
  </text>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.15s" fill="freeze"/>
    <rect x="60" y="88" width="0" height="2" fill="#22d3ee" opacity="0.7"><animate attributeName="width" values="0;180" dur="0.5s" begin="0.15s" fill="freeze"/></rect>
    <text x="60" y="105" fill="#22d3ee" font-size="12" letter-spacing="2.5" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">CODE &amp; DATA</text>
    <text x="280" y="106" fill="#c9d5e4" font-size="15" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Python · SQL · SQLite · JavaScript · pandas · NumPy</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.30s" fill="freeze"/>
    <rect x="60" y="140" width="0" height="2" fill="#43cfec" opacity="0.7"><animate attributeName="width" values="0;180" dur="0.5s" begin="0.30s" fill="freeze"/></rect>
    <text x="60" y="157" fill="#43cfec" font-size="12" letter-spacing="2.5" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">MODELS</text>
    <text x="280" y="158" fill="#c9d5e4" font-size="15" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">PyTorch · Transformers · LoRA / PEFT · scikit-learn</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.45s" fill="freeze"/>
    <rect x="60" y="192" width="0" height="2" fill="#7bb8f0" opacity="0.7"><animate attributeName="width" values="0;180" dur="0.5s" begin="0.45s" fill="freeze"/></rect>
    <text x="60" y="209" fill="#7bb8f0" font-size="12" letter-spacing="2.5" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">AGENTS</text>
    <text x="280" y="210" fill="#c9d5e4" font-size="15" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Google ADK · OpenAI Agents SDK · Claude Agent SDK · A2A</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.60s" fill="freeze"/>
    <rect x="60" y="244" width="0" height="2" fill="#9b9bf5" opacity="0.7"><animate attributeName="width" values="0;180" dur="0.5s" begin="0.60s" fill="freeze"/></rect>
    <text x="60" y="261" fill="#9b9bf5" font-size="12" letter-spacing="2.5" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">QUANTUM</text>
    <text x="280" y="262" fill="#c9d5e4" font-size="15" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Qiskit · Cirq · PennyLane</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.75s" fill="freeze"/>
    <rect x="60" y="296" width="0" height="2" fill="#a78bfa" opacity="0.7"><animate attributeName="width" values="0;180" dur="0.5s" begin="0.75s" fill="freeze"/></rect>
    <text x="60" y="313" fill="#a78bfa" font-size="12" letter-spacing="2.5" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">WORKFLOW</text>
    <text x="280" y="314" fill="#c9d5e4" font-size="15" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Git · GitHub Actions · Jupyter · tests and reproducible examples</text>
  </g>
</svg>
