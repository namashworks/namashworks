<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Where the work is pointed. Already touched: healthcare and medtech, computational biology, quantum tooling, agent infrastructure, learning systems. Wanted next, drawn dashed because it is ambition rather than a claim: robotics and autonomy, mining technology, space telemetry and on board inference, and the AI tooling layer.">
  <defs>
    <linearGradient id="rd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c1a" />
      <stop offset="60%" stop-color="#0d1428" />
      <stop offset="100%" stop-color="#141d3a" />
    </linearGradient>
    <radialGradient id="rd-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <pattern id="rd-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05" />
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#rd-bg)" />
  <circle cx="980" cy="150" r="340" fill="url(#rd-glow)" />
  <rect width="1200" height="400" fill="url(#rd-scan)" />
  <g stroke="#22d3ee" stroke-width="1.6" fill="none" opacity="0.45">
    <path d="M16,44 V16 H44" />
    <path d="M1156,16 H1184 V44" />
    <path d="M1184,356 V384 H1156" />
    <path d="M44,384 H16 V356" />
  </g>
  <text x="30" y="128" fill="#a78bfa" opacity="0.13" font-size="13" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
    <tspan x="30" dy="0">方</tspan>
    <tspan x="30" dy="18">向</tspan>
  </text>
  <text x="60" y="44" fill="#22d3ee" opacity="0.85" font-size="11" letter-spacing="3.2" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">TRAJECTORY · WHERE THIS IS POINTED</text>
  <!-- The horizon. Solid where there is work behind it, dashed where there is not. -->
  <path id="rd-flown" d="M-20,394 C 200,388 430,372 624,352" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></path>
  <path id="rd-ahead" d="M624,352 C 840,332 1030,300 1220,244" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.45" stroke-dasharray="7 7" />
  <!-- a pulse running out along the trajectory, from what is done into what is not -->
  <!-- the NOW gate -->
  <path d="M624,84 V330" stroke="#243049" stroke-width="1" />
  <path d="M624,344 l7,8 l-7,8 l-7,-8 z" fill="#0d1428" stroke="#22d3ee" stroke-width="1.3" />
  <text x="624" y="72" text-anchor="middle" fill="#64748b" font-size="10.5" letter-spacing="2.6" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">NOW</text>
  <!-- already touched -->
  <text x="80" y="104" fill="#22d3ee" font-size="11.5" letter-spacing="2.4" opacity="1" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">ALREADY TOUCHED</text>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c9d5e4">
    <g opacity="1">
      <circle cx="92" cy="145" r="4.5" fill="#22d3ee" />
      <text x="118" y="150">healthcare and medtech</text>
    </g>
    <g opacity="1">
      <circle cx="92" cy="181" r="4.5" fill="#22d3ee" />
      <text x="118" y="186">computational biology</text>
    </g>
    <g opacity="1">
      <circle cx="92" cy="217" r="4.5" fill="#22d3ee" />
      <text x="118" y="222">quantum tooling</text>
    </g>
    <g opacity="1">
      <circle cx="92" cy="253" r="4.5" fill="#22d3ee" />
      <text x="118" y="258">agent infrastructure</text>
    </g>
    <g opacity="1">
      <circle cx="92" cy="289" r="4.5" fill="#22d3ee" />
      <text x="118" y="294">learning systems</text>
    </g>
  </g>
  <!-- wanted next -->
  <text x="672" y="104" fill="#a78bfa" font-size="11.5" letter-spacing="2.4" opacity="1" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">WANT TO WORK ON NEXT</text>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c9d5e4">
    <g opacity="1">
      <circle cx="684" cy="145" r="4.5" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="2.6 2.6"></circle>
      <text x="710" y="150">robotics and autonomy</text>
    </g>
    <g opacity="1">
      <circle cx="684" cy="181" r="4.5" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="2.6 2.6"></circle>
      <text x="710" y="186">mining technology, autonomous haulage and ore body</text>
    </g>
    <g opacity="1">
      <circle cx="684" cy="217" r="4.5" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="2.6 2.6"></circle>
      <text x="710" y="222">space, telemetry and on board inference</text>
    </g>
    <g opacity="1">
      <circle cx="684" cy="253" r="4.5" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="2.6 2.6"></circle>
      <text x="710" y="258">AI itself, the tooling layer rather than the demo layer</text>
    </g>
  </g>
  <text x="672" y="300" fill="#64748b" font-size="12" opacity="1" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Drawn dashed on purpose. Nothing is shipped here yet.</text>
  <text x="60" y="332" fill="#475569" font-size="11" letter-spacing="1.8" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">THE LEFT LIST HAS REPOSITORIES BEHIND IT · THE RIGHT LIST IS AMBITION, NOT A CLAIM</text>
</svg>