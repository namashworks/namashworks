<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img"
     aria-label="A universe in every layer. Seven concentric rings rise from behind a planet's limb, reading at once as a sunrise, an atom with electron orbits, and a ringed seal. Each ring is one of seven layers of work across sixteen repositories: learning core, data, models, applied AI, agents, knowledge and quantum.">
  <defs>
    <radialGradient id="cc-sky" cx="34%" cy="78%" r="95%">
      <stop offset="0%" stop-color="#1b0f3a"/>
      <stop offset="45%" stop-color="#0d0722"/>
      <stop offset="100%" stop-color="#050310"/>
    </radialGradient>
    <radialGradient id="cc-dawn" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f4e8ff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#a36bf3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5c2aaf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cc-core" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0dcff"/>
      <stop offset="100%" stop-color="#b98cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a34cf" stop-opacity="0"/>
      <stop offset="35%" stop-color="#c6a2fb" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#f4e8ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6a34cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cc-spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a34cf"/>
      <stop offset="100%" stop-color="#f4e8ff"/>
    </linearGradient>
    <filter id="cc-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="cc-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <!-- everything celestial is clipped to the sky, so the planet occludes it -->
    <clipPath id="cc-above" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" d="M0,0 H1200 V700 H0 Z M2450,2400 a1850,1850 0 1,0 -3700,0 a1850,1850 0 1,0 3700,0"/>
    </clipPath>
    <path id="cc-tomoe" d="M0,0 a5,5 0 1,0 0.01,0 Z M-3.4,-3.6 C-11,-1.6 -17,4.4 -19,13.4 C-14,5.4 -8,1.4 -1.2,-0.6 Z"/>
  </defs>

  <rect width="1200" height="700" fill="url(#cc-sky)"/>

  <!-- starfield -->
  <g fill="#cbbdf0">
    <circle cx="88" cy="96" r="1.3" opacity="0.7"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="163" cy="212" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="246" cy="74" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="168" r="0.9" opacity="0.45"/>
    <circle cx="452" cy="62" r="1.2" opacity="0.65"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="4.9s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="536" cy="140" r="1" opacity="0.5"/>
    <circle cx="604" cy="252" r="1.4" opacity="0.75"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="5.1s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="676" cy="88" r="1.1" opacity="0.55"/>
    <circle cx="720" cy="330" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="330" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="4.5s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="58" cy="452" r="1" opacity="0.45"/>
    <circle cx="196" cy="470" r="0.9" opacity="0.4"/>
    <circle cx="372" cy="118" r="0.9" opacity="0.45"/>
    <circle cx="640" cy="186" r="0.9" opacity="0.4"/>
    <circle cx="284" cy="292" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.8s" begin="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Otsutsuki moon -->
  <g opacity="0.9">
    <circle cx="690" cy="150" r="30" fill="none" stroke="#8049e2" stroke-width="1" opacity="0.35"/>
    <circle cx="690" cy="150" r="19" fill="#1a0f38"/>
    <path d="M690,131 a19,19 0 1,0 0.01,0 Z M690,131 a19,19 0 0,1 0,38 a13,15 0 0,1 0,-38 Z" fill="#e8d4ff" opacity="0.92"/>
    <circle cx="690" cy="150" r="19" fill="none" stroke="#f4e8ff" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- the sun rising from behind the limb -->
  <g clip-path="url(#cc-above)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="2.4s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 150" to="0 0" dur="2.6s" begin="0.2s" fill="freeze"/>
      <circle cx="400" cy="520" r="330" fill="url(#cc-dawn)"/>
      <circle cx="400" cy="520" r="62" fill="url(#cc-core)"/>
      <circle cx="400" cy="520" r="20" fill="#ffffff" filter="url(#cc-soft)">
        <animate attributeName="r" values="18;24;18" dur="5.2s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- seven layers, lighting inner to outer -->
    <g fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round">
      <circle cx="400" cy="520" r="55" stroke="#f4e8ff" stroke-width="2.6">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" begin="1.8s" fill="freeze"/></circle>
      <circle cx="400" cy="520" r="100" stroke="#ddc4ff" stroke-width="2.4">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" begin="2.3s" fill="freeze"/></circle>
      <circle cx="400" cy="520" r="145" stroke="#c6a2fb" stroke-width="2.2">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" begin="2.8s" fill="freeze"/></circle>
      <circle cx="400" cy="520" r="190" stroke="#ae82f5" stroke-width="2.1">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" begin="3.3s" fill="freeze"/></circle>
      <circle cx="400" cy="520" r="235" stroke="#9764ee" stroke-width="2">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" begin="3.8s" fill="freeze"/></circle>
      <circle cx="400" cy="520" r="280" stroke="#8049e2" stroke-width="1.9">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" begin="4.3s" fill="freeze"/></circle>
      <circle cx="400" cy="520" r="325" stroke="#6a34cf" stroke-width="1.8">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" begin="4.8s" fill="freeze"/></circle>
    </g>

    <!-- a charge circulating each layer once it is lit -->
    <g fill="none" pathLength="100" stroke-dasharray="4 96" stroke-linecap="round" opacity="0.95">
      <circle cx="400" cy="520" r="100" stroke="#ffffff" stroke-width="2.6">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="7s" begin="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="520" r="190" stroke="#ffffff" stroke-width="2.4">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="9s" begin="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="520" r="325" stroke="#e8d4ff" stroke-width="2.2">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="12s" begin="5.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- electron shells: the same drawing read as an atom -->
    <g fill="none" stroke="#a36bf3" stroke-width="1.1" opacity="0.34">
      <ellipse cx="400" cy="520" rx="300" ry="104"/>
      <ellipse cx="400" cy="520" rx="300" ry="104" transform="rotate(60 400 520)"/>
      <ellipse cx="400" cy="520" rx="300" ry="104" transform="rotate(120 400 520)"/>
    </g>
    <g fill="#f4e8ff">
      <circle r="4.5" opacity="0.95">
        <animateMotion dur="9s" repeatCount="indefinite" path="M700,520 a300,104 0 1,0 -600,0 a300,104 0 1,0 600,0"/>
      </circle>
      <circle r="4" opacity="0.9">
        <animateMotion dur="11s" begin="-3s" repeatCount="indefinite" path="M550,780 a300,104 0 1,0 -300,-520 a300,104 0 1,0 300,520" transform="rotate(60 400 520)"/>
      </circle>
      <circle r="4" opacity="0.9">
        <animateMotion dur="13s" begin="-7s" repeatCount="indefinite" path="M250,780 a300,104 0 1,0 300,-520 a300,104 0 1,0 -300,520" transform="rotate(120 400 520)"/>
      </circle>
    </g>

    <!-- rotating seals -->
    <g fill="#e8d4ff" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0 400 520" to="360 400 520" dur="48s" repeatCount="indefinite"/>
      <use href="#cc-tomoe" transform="translate(400,375)"/>
      <use href="#cc-tomoe" transform="translate(525.6,447.5) rotate(60)"/>
      <use href="#cc-tomoe" transform="translate(274.4,447.5) rotate(-60)"/>
    </g>
    <g fill="#c6a2fb" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="360 400 520" to="0 400 520" dur="76s" repeatCount="indefinite"/>
      <use href="#cc-tomoe" transform="translate(400,240) scale(0.85)"/>
      <use href="#cc-tomoe" transform="translate(642.5,380) rotate(60) scale(0.85)"/>
      <use href="#cc-tomoe" transform="translate(642.5,660) rotate(120) scale(0.85)"/>
      <use href="#cc-tomoe" transform="translate(400,800) rotate(180) scale(0.85)"/>
      <use href="#cc-tomoe" transform="translate(157.5,660) rotate(240) scale(0.85)"/>
      <use href="#cc-tomoe" transform="translate(157.5,380) rotate(300) scale(0.85)"/>
    </g>
  </g>

  <!-- the planet -->
  <circle cx="600" cy="2400" r="1850" fill="#07030f"/>
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="url(#cc-rim)" stroke-width="2.4" opacity="0.85"/>
  <path d="M-250,700 A1850,1850 0 0 1 1450,700" fill="none" stroke="#c6a2fb" stroke-width="9" opacity="0.14" filter="url(#cc-glow)"/>

  <!-- ink clouds -->
  <g fill="#1c0f3c" stroke="#8049e2" stroke-width="1" opacity="0.5">
    <g transform="translate(96,604) scale(0.9)">
      <animateTransform attributeName="transform" type="translate" values="96,604; 116,600; 96,604" dur="26s" repeatCount="indefinite" additive="sum"/>
      <path d="M0,22 C0,9 12,1 25,6 C31,-6 51,-6 58,6 C71,1 83,9 83,22 C83,33 70,40 58,35 C51,45 31,45 25,35 C12,40 0,33 0,22 Z"/>
    </g>
    <g transform="translate(560,640) scale(0.7)">
      <animateTransform attributeName="transform" type="translate" values="560,640; 536,636; 560,640" dur="34s" repeatCount="indefinite" additive="sum"/>
      <path d="M0,22 C0,9 12,1 25,6 C31,-6 51,-6 58,6 C71,1 83,9 83,22 C83,33 70,40 58,35 C51,45 31,45 25,35 C12,40 0,33 0,22 Z"/>
    </g>
  </g>

  <text x="60" y="668" fill="#6f5f96" font-size="10.5" letter-spacing="2.4"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">7 LAYERS · 16 REPOSITORIES · ALL MINE, NO FORKS · BUILT OUTWARD FROM THE CORE</text>

  <!-- the legend, tied to the rings by colour alone -->
  <text x="748" y="62" fill="#c6a2fb" opacity="0.9" font-size="11" letter-spacing="3.2"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">SYSTEM MAP · NAMASHWORKS</text>
  <text x="748" y="104" fill="#f4e8ff" font-size="27" font-weight="600"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">A universe in every layer.</text>
  <text x="748" y="132" fill="#9a8bb8" font-size="13"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Foundations at the centre. Frontiers at the edge.</text>
  <line x1="748" y1="152" x2="1160" y2="152" stroke="#2a1a52" stroke-width="1.2"/>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.8s" fill="freeze"/>
    <rect x="748" y="182" width="10" height="10" fill="#6a34cf"/>
    <text x="770" y="192" fill="#8f6ae0" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">QUANTUM</text>
    <text x="770" y="210" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">qledger</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.3s" fill="freeze"/>
    <rect x="748" y="250" width="10" height="10" fill="#8049e2"/>
    <text x="770" y="260" fill="#8049e2" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">KNOWLEDGE</text>
    <text x="770" y="278" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">egkg-architecture · StudyMate</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.8s" fill="freeze"/>
    <rect x="748" y="318" width="10" height="10" fill="#9764ee"/>
    <text x="770" y="328" fill="#9764ee" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">AGENTS</text>
    <text x="770" y="346" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Bridge-ADK · IPipe · Chatform</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.3s" fill="freeze"/>
    <rect x="748" y="386" width="10" height="10" fill="#ae82f5"/>
    <text x="770" y="396" fill="#ae82f5" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">APPLIED AI</text>
    <text x="770" y="414" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Genz-medical-advisor · Successapp · autoRECON</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.8s" fill="freeze"/>
    <rect x="748" y="454" width="10" height="10" fill="#c6a2fb"/>
    <text x="770" y="464" fill="#c6a2fb" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">MODELS</text>
    <text x="770" y="482" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Genetic-Transformer · FNet-Pytorch-Implementation</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.3s" fill="freeze"/>
    <rect x="748" y="522" width="10" height="10" fill="#ddc4ff"/>
    <text x="770" y="532" fill="#ddc4ff" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">DATA</text>
    <text x="770" y="550" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Json-to-Toon-converter · multiformat-toon</text>
    <text x="770" y="566" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Synthetic-Data-Generator-with-converter</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/>
    <rect x="748" y="608" width="10" height="10" fill="#f4e8ff"/>
    <text x="770" y="618" fill="#f4e8ff" font-size="12.5" letter-spacing="2.4" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">LEARNING CORE</text>
    <text x="770" y="636" fill="#9a8bb8" font-size="11.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">stam-ml · movie-rating-prediction-ml-pipeline</text>
  </g>
  <line x1="748" y1="590" x2="1160" y2="590" stroke="#2a1a52" stroke-width="1.2"/>
  <rect x="742" y="182" width="2" height="446" fill="url(#cc-spine)" opacity="0.35"/>
</svg>
