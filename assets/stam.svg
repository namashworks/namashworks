<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="STAM: anchors settling onto a data manifold and connecting into a topology">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="60%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#141d3a"/>
    </linearGradient>
    <linearGradient id="st-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="st-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fe7f7" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#st-bg)"/>
  <circle cx="300" cy="150" r="230" fill="url(#st-glow)"/>
  <circle cx="820" cy="160" r="210" fill="url(#st-glow)"/>
  <rect width="1200" height="300" fill="url(#st-scan)"/>
  <g stroke="#a78bfa" stroke-width="1.6" fill="none" opacity="0.45">
    <path d="M16,44 V16 H44"/><path d="M1156,16 H1184 V44"/>
    <path d="M1184,256 V284 H1156"/><path d="M44,284 H16 V256"/>
    <animate attributeName="opacity" values="0.45;0.82;0.45" dur="5.2s" repeatCount="indefinite"/>
  </g>
  <text x="30" y="112" fill="#a78bfa" opacity="0.14" font-size="13"
        font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
    <tspan x="30" dy="0">ア</tspan><tspan x="30" dy="18">ン</tspan><tspan x="30" dy="18">カ</tspan>
    <tspan x="30" dy="18">ー</tspan>
  </text>

  <text x="60" y="44" fill="#a78bfa" opacity="0.9" font-size="11" letter-spacing="3.2"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">STAM · SPARSE TOPOLOGICAL ANCHOR MAPPER</text>

  <!-- the data -->
  <g fill="#334155">
    <circle cx="180" cy="120" r="2"/><circle cx="205" cy="95" r="2"/><circle cx="232" cy="150" r="2"/>
    <circle cx="248" cy="110" r="2"/><circle cx="260" cy="180" r="2"/><circle cx="275" cy="88" r="2"/>
    <circle cx="290" cy="140" r="2"/><circle cx="305" cy="200" r="2"/><circle cx="318" cy="105" r="2"/>
    <circle cx="330" cy="165" r="2"/><circle cx="345" cy="125" r="2"/><circle cx="358" cy="205" r="2"/>
    <circle cx="372" cy="95" r="2"/><circle cx="385" cy="155" r="2"/><circle cx="398" cy="120" r="2"/>
    <circle cx="410" cy="190" r="2"/><circle cx="425" cy="140" r="2"/>
    <circle cx="500" cy="160" r="2"/><circle cx="540" cy="120" r="2"/><circle cx="575" cy="190" r="2"/>
    <circle cx="610" cy="140" r="2"/><circle cx="640" cy="175" r="2"/>
    <circle cx="700" cy="110" r="2"/><circle cx="722" cy="165" r="2"/><circle cx="740" cy="95" r="2"/>
    <circle cx="755" cy="200" r="2"/><circle cx="770" cy="135" r="2"/><circle cx="788" cy="175" r="2"/>
    <circle cx="800" cy="105" r="2"/><circle cx="815" cy="215" r="2"/><circle cx="828" cy="150" r="2"/>
    <circle cx="845" cy="120" r="2"/><circle cx="860" cy="190" r="2"/><circle cx="875" cy="140" r="2"/>
    <circle cx="890" cy="100" r="2"/><circle cx="905" cy="175" r="2"/><circle cx="920" cy="130" r="2"/>
  </g>

  <!-- topology, drawn once the anchors have settled -->
  <g stroke="url(#st-edge)" stroke-width="1.2" fill="none" opacity="0.55"
     stroke-dasharray="100" stroke-dashoffset="100" pathLength="100" stroke-linecap="round">
    <line x1="250" y1="130" x2="295" y2="105"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="2.4s" fill="freeze"/></line>
    <line x1="250" y1="130" x2="330" y2="170"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="2.55s" fill="freeze"/></line>
    <line x1="330" y1="170" x2="400" y2="120"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="2.7s" fill="freeze"/></line>
    <line x1="295" y1="105" x2="400" y2="120"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="2.85s" fill="freeze"/></line>
    <line x1="400" y1="120" x2="520" y2="155"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="3.0s" fill="freeze"/></line>
    <line x1="520" y1="155" x2="620" y2="160"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="3.15s" fill="freeze"/></line>
    <line x1="620" y1="160" x2="760" y2="140"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="3.3s" fill="freeze"/></line>
    <line x1="760" y1="140" x2="840" y2="170"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="3.45s" fill="freeze"/></line>
    <line x1="840" y1="170" x2="900" y2="130"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="3.6s" fill="freeze"/></line>
    <line x1="760" y1="140" x2="900" y2="130"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="3.75s" fill="freeze"/></line>
  </g>

  <!-- anchors, drifting onto the manifold -->
  <g>
    <g><animateTransform attributeName="transform" type="translate" from="-46 30" to="0 0" dur="2.2s" begin="0.1s" fill="freeze"/>
      <circle cx="250" cy="130" r="7" fill="#0d1428" stroke="#22d3ee" stroke-width="1.6"/>
      <circle cx="250" cy="130" r="2.4" fill="#22d3ee"><animate attributeName="r" values="2.2;3.3;2.2" dur="4.0s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="28 -34" to="0 0" dur="2.2s" begin="0.2s" fill="freeze"/>
      <circle cx="295" cy="105" r="7" fill="#0d1428" stroke="#22d3ee" stroke-width="1.6"/>
      <circle cx="295" cy="105" r="2.4" fill="#22d3ee"><animate attributeName="r" values="2.2;3.3;2.2" dur="4.4s" begin="0.3s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="-20 44" to="0 0" dur="2.2s" begin="0.3s" fill="freeze"/>
      <circle cx="330" cy="170" r="7" fill="#0d1428" stroke="#22d3ee" stroke-width="1.6"/>
      <circle cx="330" cy="170" r="2.4" fill="#22d3ee"><animate attributeName="r" values="2.2;3.3;2.2" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="34 -26" to="0 0" dur="2.2s" begin="0.4s" fill="freeze"/>
      <circle cx="400" cy="120" r="7" fill="#0d1428" stroke="#7bb8f0" stroke-width="1.6"/>
      <circle cx="400" cy="120" r="2.4" fill="#7bb8f0"><animate attributeName="r" values="2.2;3.3;2.2" dur="4.8s" begin="0.9s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="-38 -30" to="0 0" dur="2.2s" begin="0.5s" fill="freeze"/>
      <circle cx="520" cy="155" r="7" fill="#0d1428" stroke="#8ea9f2" stroke-width="1.6"/>
      <circle cx="520" cy="155" r="2.4" fill="#8ea9f2"><animate attributeName="r" values="2.2;3.3;2.2" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="24 40" to="0 0" dur="2.2s" begin="0.6s" fill="freeze"/>
      <circle cx="620" cy="160" r="7" fill="#0d1428" stroke="#9b9bf5" stroke-width="1.6"/>
      <circle cx="620" cy="160" r="2.4" fill="#9b9bf5"><animate attributeName="r" values="2.2;3.3;2.2" dur="3.9s" begin="1.5s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="-30 -40" to="0 0" dur="2.2s" begin="0.7s" fill="freeze"/>
      <circle cx="760" cy="140" r="7" fill="#0d1428" stroke="#a78bfa" stroke-width="1.6"/>
      <circle cx="760" cy="140" r="2.4" fill="#a78bfa"><animate attributeName="r" values="2.2;3.3;2.2" dur="5.1s" begin="0.4s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="40 28" to="0 0" dur="2.2s" begin="0.8s" fill="freeze"/>
      <circle cx="840" cy="170" r="7" fill="#0d1428" stroke="#a78bfa" stroke-width="1.6"/>
      <circle cx="840" cy="170" r="2.4" fill="#a78bfa"><animate attributeName="r" values="2.2;3.3;2.2" dur="4.5s" begin="1.8s" repeatCount="indefinite"/></circle></g>
    <g><animateTransform attributeName="transform" type="translate" from="-26 -44" to="0 0" dur="2.2s" begin="0.9s" fill="freeze"/>
      <circle cx="900" cy="130" r="7" fill="#0d1428" stroke="#a78bfa" stroke-width="1.6"/>
      <circle cx="900" cy="130" r="2.4" fill="#a78bfa"><animate attributeName="r" values="2.2;3.3;2.2" dur="3.8s" begin="2.1s" repeatCount="indefinite"/></circle></g>
  </g>

  <!-- new data arriving: each pulse is a point the nearest anchors are pulled toward -->
  <g fill="none" stroke="#fbbf24" stroke-width="1.3">
    <circle cx="300" cy="150" r="2"><animate attributeName="r" values="2;19" dur="2.6s" begin="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.95;0" dur="2.6s" begin="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="178" r="2"><animate attributeName="r" values="2;19" dur="2.6s" begin="5.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.95;0" dur="2.6s" begin="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="862" cy="118" r="2"><animate attributeName="r" values="2;19" dur="2.6s" begin="6.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.95;0" dur="2.6s" begin="6.0s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#fbbf24">
    <circle cx="300" cy="150" r="2.4" opacity="0"><animate attributeName="opacity" values="1;0" dur="2.6s" begin="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="178" r="2.4" opacity="0"><animate attributeName="opacity" values="1;0" dur="2.6s" begin="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="862" cy="118" r="2.4" opacity="0"><animate attributeName="opacity" values="1;0" dur="2.6s" begin="6.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- legend -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="10.5" fill="#64748b" letter-spacing="1.2">
    <circle cx="992" cy="66" r="2" fill="#334155"/><text x="1008" y="70">data point</text>
    <circle cx="992" cy="92" r="6" fill="#0d1428" stroke="#22d3ee" stroke-width="1.4"/><text x="1008" y="96">anchor</text>
    <line x1="985" y1="118" x2="999" y2="118" stroke="#a78bfa" stroke-width="1.3"/><text x="1008" y="122">topology edge</text>
    <circle cx="992" cy="144" r="6" fill="none" stroke="#fbbf24" stroke-width="1.2"/><text x="1008" y="148">incoming sample</text>
  </g>

  <text x="60" y="276" fill="#475569" font-size="11" letter-spacing="1.8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">ANCHORS MOVE, SPLIT AND CONNECT TO COVER THE MANIFOLD · CPU ONLY · FIXED MEMORY · EVERY PREDICTION TRACEABLE</text>
</svg>
